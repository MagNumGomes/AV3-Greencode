services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: greencode
      POSTGRES_PASSWORD: greencode_dev
      POSTGRES_DB: greencode
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - greencode_av3_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greencode -d greencode"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - greencode_av3_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  greencode_av3_pg:
  greencode_av3_redis:
